services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    container_name: tms-app
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8084:8084"

    environment:
      CONFIG_PATH: /app/config.yaml
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    networks:
      - tms-runtime

    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 8082 && nc -z 127.0.0.1 8084
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tms-runtime:
    external: true
    name: tms-runtime
